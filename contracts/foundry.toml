[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# No CBOR metadata: leaner, path-independent bytecode (deterministic CREATE2 library addresses).
bytecode_hash = "none"
cbor_metadata = false

remappings = ["forge-std/=lib/forge-std/src/"]

[fmt]
line_length = 120

[lint]
lint_on_build = false
